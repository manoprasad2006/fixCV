<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FixCV</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <span id="appName">FixCV</span>
  <span id="langBadge"></span>
</header>

<main>
  <!-- Screen 1: language + disclaimer -->
  <section id="screen-lang">
    <h1 id="tagline"></h1>
    <p class="disclaimer" id="disclaimerEn"></p>
    <p class="disclaimer" id="disclaimerTa"></p>
    <p class="disclaimer" id="disclaimerHi"></p>
    <h2 id="chooseLanguage"></h2>
    <div class="langrow">
      <button data-lang="en">English</button>
      <button data-lang="ta">தமிழ்</button>
      <button data-lang="hi">हिन्दी</button>
    </div>
  </section>

  <!-- Screen 2: camera + describe -->
  <section id="screen-fix" hidden>
    <p id="tapPrompt" class="hint"></p>
    <div class="camwrap">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>
    <p id="segStatus" class="hint"></p>
    <label id="describeLabel" for="transcript"></label>
    <textarea id="transcript" rows="3"></textarea>
    <div class="btnrow">
      <button id="btnSpeak"></button>
      <button id="btnSteps" class="primary"></button>
    </div>
    <p id="fixError" class="error"></p>
  </section>

  <!-- Screen 3: steps + verify -->
  <section id="screen-steps" hidden>
    <h2 id="causeLabel"></h2>
    <p id="cause"></p>
    <ol id="steps"></ol>
    <div id="question" class="card" hidden></div>
    <h2 id="verifyTitle"></h2>
    <div class="btnrow">
      <button id="btnVerify" class="primary"></button>
    </div>
    <p id="verifyMsg"></p>
    <p id="stepError" class="error"></p>
  </section>

  <!-- Screen 4: stop -->
  <section id="screen-stop" hidden>
    <h1 id="stopTitle"></h1>
    <p id="stopMessage"></p>
    <button id="btnNew1"></button>
  </section>

  <!-- Screen 5: summary -->
  <section id="screen-done" hidden>
    <h1 id="summaryTitle"></h1>
    <h2 id="fixedH"></h2>
    <ul id="fixedList"></ul>
    <h2 id="notFixedH"></h2>
    <ul id="notFixedList"></ul>
    <p id="callPro" class="hint"></p>
    <button id="btnNew2"></button>
  </section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
