<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FixCV</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <span id="appName">FixCV</span>
  <span class="topright"><span id="langBadge"></span><button id="btnRestart" hidden></button></span>
</header>

<main>
  <!-- Screen 1: language + disclaimer -->
  <section id="screen-lang">
    <h1 id="tagline"></h1>
    <p class="disclaimer" id="disclaimerEn"></p>
    <p class="disclaimer" id="disclaimerTa"></p>
    <p class="disclaimer" id="disclaimerHi"></p>
    <h2 id="chooseLanguage"></h2>
    <div class="langrow">
      <button data-lang="en">English</button>
      <button data-lang="ta">தமிழ்</button>
      <button data-lang="hi">हिन्दी</button>
    </div>
  </section>

  <!-- Screen 2: chat -->
  <section id="screen-chat" hidden>
    <div id="cameraCard">
      <div class="camwrap">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="btnrow tight">
        <button id="btnTrack" class="small"></button>
        <span id="segStatus" class="hint"></span>
      </div>
    </div>
    <p id="tapPrompt" class="hint"></p>
    <div id="thread"></div>
    <div id="chips"></div>
    <form id="composer">
      <textarea id="msgInput" rows="2"></textarea>
      <button type="button" id="btnMic" title="mic"></button>
      <button type="submit" id="btnSend" class="primary"></button>
    </form>
  </section>

  <!-- Screen 3: stop -->
  <section id="screen-stop" hidden>
    <h1 id="stopTitle"></h1>
    <p id="stopMessage"></p>
    <button id="btnNew1"></button>
  </section>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
